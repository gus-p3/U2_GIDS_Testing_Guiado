# Disposable PostgreSQL used ONLY for automated tests of this exercise.
# Data lives in tmpfs: stopping the container wipes it (never point tests at real data).
name: ejercicio-test
services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_DB: task_manager_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: local_test_only_password
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d task_manager_test"]
      interval: 3s
      timeout: 3s
      retries: 20
